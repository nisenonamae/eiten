<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>栄典</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7d1f2c">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f3f6; --card:#fbfbfd; --ink:#1f2433; --sub:#5d6478; --line:#d5d8e0;
  --ribbon:#7d1f2c; --gilt:#b08a3e; --gilt-pale:#efe4cc; --lapis:#2b4a86; --ok:#2f6b47;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --sans:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lapis);outline-offset:2px}

/* 綬の帯 */
.band{height:10px;background:linear-gradient(90deg,var(--ribbon) 0 38%,var(--gilt) 38% 41%,var(--ribbon) 41% 59%,var(--gilt) 59% 62%,var(--ribbon) 62%)}
header{max-width:960px;margin:0 auto;padding:18px 16px 8px;display:flex;align-items:flex-end;gap:14px}
h1{font-family:var(--mincho);font-weight:700;font-size:40px;letter-spacing:.18em;margin:0;line-height:1}
.lead{margin:0 0 3px;color:var(--sub);font-size:13px}
#connBtn{margin-left:auto}

#conn{max-width:960px;margin:0 auto 6px;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:6px}
#conn .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#conn label{display:flex;flex-direction:column;font-size:12px;color:var(--sub)}
#conn .row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ver{font-size:12px;color:var(--sub)}

nav#tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
nav#tabs .in{max-width:960px;margin:0 auto;display:flex;overflow-x:auto;padding:0 8px}
nav#tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
nav#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ribbon);font-weight:600}

main{max-width:960px;margin:0 auto;padding:12px 16px 80px}
h2{font-family:var(--mincho);font-size:21px;margin:26px 0 8px;font-weight:700}
h2:first-child{margin-top:8px}
h3{font-size:15px;margin:0 0 4px}
.note{color:var(--sub);font-size:13px;margin:4px 0 10px}
.empty{color:var(--sub);padding:14px;border:1px dashed var(--line);border-radius:6px;background:var(--card)}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:4px;padding:6px 14px;cursor:pointer}
.btn.line{background:transparent;color:var(--ink)}
.btn.gilt{background:var(--gilt);border-color:var(--gilt);color:#241a05}
.btn.small{padding:2px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);border-radius:4px;background:#fff;padding:6px 8px;width:100%}
textarea{min-height:70px;resize:vertical}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 12px;cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.def{border-top:1px solid var(--line);padding:12px 2px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.def:last-child{border-bottom:1px solid var(--line)}
.def .art{grid-row:span 2}
.def .medal{margin:0}
.def dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:14px}
.def dt{color:var(--sub)}
.def dd{margin:0}
.def .acts{grid-column:2}
.tag{display:inline-block;font-size:12px;border-radius:3px;padding:0 6px;margin-right:4px;background:#e6e8ee}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin:10px 0}
.card.pending{border-left:4px solid var(--gilt)}
.form{display:grid;gap:10px}
.form label.f{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--sub)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink);font-size:14px}
.checks label{display:flex;gap:4px;align-items:center}
.diff{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.diff th,.diff td{border-bottom:1px solid var(--line);text-align:left;padding:4px 6px;vertical-align:top}
.diff th{color:var(--sub);font-weight:400;white-space:nowrap}
.diff .chg td{background:var(--gilt-pale)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.log{border-top:1px solid var(--line);padding:8px 2px;font-size:14px}
.log summary{cursor:pointer}
.st-approved{color:var(--ok);font-weight:600}
.st-returned{color:var(--ribbon);font-weight:600}

/* 一覧の棚 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:18px 10px;padding:18px 12px 14px;
  background:linear-gradient(#e7e9ef,#e7e9ef) bottom/100% 0 no-repeat;}
.slot{text-align:center;font-size:13px;position:relative;padding-bottom:12px}
.slot::after{content:"";position:absolute;left:4px;right:4px;bottom:0;height:6px;border-radius:2px;background:#c9ccd5;box-shadow:0 2px 0 #b4b8c3}
.slot .nm{font-weight:600;line-height:1.35;margin-top:2px}
.slot .sm{color:var(--sub);font-size:12px;line-height:1.4}
.slot.off .nm{color:var(--sub);font-weight:400}
.medal{display:block;margin:0 auto;overflow:hidden}
.m-near{filter:saturate(.35) brightness(.92);opacity:.8}
.m-expired{filter:grayscale(1);opacity:.55}
.m-shadow :is(path,circle,rect,ellipse,polygon){fill:none!important;stroke:#a9aebb!important;stroke-width:1.6;stroke-dasharray:4 3;opacity:1!important}
.m-shadow text{display:none}
.rights .card{display:flex;gap:12px;align-items:center}
.door{flex:none;width:34px;height:44px;border:2px solid var(--lapis);border-radius:16px 16px 2px 2px;background:#dfe6f3}
.door.off{border-color:#a9aebb;background:none;border-style:dashed}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:6px;font-size:14px;max-width:90vw;display:none;z-index:20}
#toast.err{background:var(--ribbon)}
#toast.show{display:block}


/* 樹形図 */
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--sub);margin:4px 0 8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid;vertical-align:-1px;margin-right:4px}
.tree-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;-webkit-overflow-scrolling:touch}
.tree{display:block;margin:0 auto}
.edge{fill:none;stroke:#c9ccd5;stroke-width:2}
.edge.on{stroke:var(--gilt);stroke-width:2.5}
.tn{cursor:pointer}
.tn:focus{outline:none}
.tn:focus-visible .ring,.tn:focus-visible .door-n{stroke:var(--ink)}
.tn .ring{fill:var(--card);stroke-width:3}
.tn-got .ring{stroke:var(--gilt);fill:#fffaf0}
.tn-open .ring{stroke:var(--lapis)}
.tn-locked .ring{stroke:#a9aebb;stroke-dasharray:4 3}
.tn .door-n{stroke-width:3}
.tn-got .door-n{fill:#dfe6f3;stroke:var(--lapis)}
.tn-open .door-n{fill:var(--card);stroke:var(--lapis)}
.tn-locked .door-n{fill:var(--card);stroke:#a9aebb;stroke-dasharray:4 3}
.tn-out{opacity:.5}
.tn-sel .ring,.tn-sel .door-n{stroke-width:5}
.tn text{font-size:12px;fill:var(--ink);text-anchor:middle}
.tn-locked text{fill:var(--sub)}
.detail dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 12px;margin:8px 0 0;font-size:14px}
.detail dt{color:var(--sub)}
.detail dd{margin:0}
.reqs{margin:0;padding:0;list-style:none}

/* 工房 */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:18px;align-items:start}
.stage{position:sticky;top:52px;z-index:3;background:var(--paper)}
#st-canvas{width:100%;max-width:540px;aspect-ratio:1/1;display:block;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;overflow:hidden}
.selmark{fill:none;stroke:var(--lapis);stroke-width:.5;stroke-dasharray:1.5 1;pointer-events:none}
.handle{fill:#fff;stroke:var(--lapis);stroke-width:.6;cursor:grab}
.panel section{margin-bottom:16px}
.panel h3{font-size:14px;margin:0 0 6px}
.shelfbox summary{cursor:pointer;margin-bottom:4px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.thumb{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px;cursor:pointer;font-size:10px;line-height:1.25;color:var(--sub);overflow:hidden}
.thumb svg{display:block;width:100%;height:auto;margin-bottom:1px}
.thumb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.items li{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--line);padding:3px 0;font-size:13px}
.items li.sel{background:var(--gilt-pale)}
.items .nm{flex:1;cursor:pointer;padding:2px 4px}
.ib{border:1px solid var(--line);background:#fff;border-radius:3px;padding:1px 7px;cursor:pointer;font-size:12px}
.ib:disabled{opacity:.4;cursor:default}
.sl{display:grid;grid-template-columns:5.5em 1fr 3em;align-items:center;gap:6px;font-size:13px;margin:2px 0}
.sl output{text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
.swatches{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.sw{width:28px;height:28px;border-radius:4px;border:1px solid var(--line);cursor:pointer;font-size:10px;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}

/* 認定の演出 */
#fanfare{position:fixed;inset:0;z-index:30;background:rgba(18,20,30,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;cursor:pointer;text-align:center;padding:20px}
#fanfare .rays{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;margin:-70vmax 0 0 -70vmax;opacity:.32;animation:rays 14s linear infinite,raysin 1.1s ease-out both}
#fanfare .big{position:relative;animation:rise 1s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 6px 24px rgba(0,0,0,.5))}
#fanfare h2{position:relative;font-family:var(--mincho);font-size:30px;letter-spacing:.08em;margin:16px 0 4px;animation:fade .6s .5s both}
#fanfare p{position:relative;margin:0;animation:fade .6s .7s both}
#fanfare .close{font-size:12px;opacity:.6;margin-top:22px}
#fanfare .cf{position:absolute;top:-5vh;width:7px;height:13px;border-radius:1px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes raysin{from{opacity:0;scale:.15}}
@keyframes rise{from{transform:scale(.15);opacity:0}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
@keyframes fall{to{transform:translateY(112vh) rotate(800deg)}}
@media (max-width:760px){
  .studio{grid-template-columns:1fr}
  .stage{top:44px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  #st-canvas{max-height:40vh;width:auto;max-width:100%}
}
@media (max-width:600px){
  h1{font-size:32px}
  .def{grid-template-columns:1fr}
  .def .art{grid-row:auto}
  .def .acts{grid-column:1}
  .form .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<header>
  <div>
    <h1>栄典</h1>
  </div>
  <p class="lead">実績と挑戦権</p>
  <button id="connBtn" class="btn line small" aria-expanded="false" aria-controls="conn">接続</button>
</header>
<section id="conn" hidden>
  <div class="grid">
    <label>持ち主<input type="text" id="c-owner" autocomplete="off"></label>
    <label>リポジトリ<input type="text" id="c-repo" autocomplete="off"></label>
    <label>ブランチ<input type="text" id="c-branch" autocomplete="off"></label>
    <label>トークン<input type="password" id="c-token" autocomplete="off"></label>
  </div>
  <div class="row">
    <button class="btn small" id="c-save">つないで読み込む</button>
    <span class="ver">今開いている版:<b id="ver"></b></span>
    <span class="ver" id="c-status"></span>
  </div>
</section>
<nav id="tabs"><div class="in" role="tablist"></div></nav>
<main id="main"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const VERSION = '2026-10-09 r2';
const PATHS = { data: 'roadmap/apps/eiten/data.json', ministries: 'roadmap/gov/ministries.json' };

/* ===================== 決まり(画面に依らない計算) ===================== */
const E = (() => {
  const DAY = 864e5, NEAR_DAYS = 14;
  const KEYS = ['achievements','challenges','parts','arts','grants','rights','reviews','rules'];
  const clone = o => JSON.parse(JSON.stringify(o));

  // 1日の区切りは日本時間の朝5時(= UTC + 4時間 の日付)
  function taskDay(d){ d = d || new Date(); return new Date(d.getTime() + 4*3600e3).toISOString().slice(0,10); }
  function addDays(day, n){ return new Date(Date.parse(day + 'T00:00:00Z') + n*DAY).toISOString().slice(0,10); }
  function diffDays(a, b){ return Math.round((Date.parse(b+'T00:00:00Z') - Date.parse(a+'T00:00:00Z'))/DAY); }

  function emptyData(){ const d = { version: 1 }; KEYS.forEach(k => d[k] = []); return d; }
  function normalize(d){
    d = (d && typeof d === 'object') ? d : {};
    d.version = d.version || 1;
    KEYS.forEach(k => { if(!Array.isArray(d[k])) d[k] = []; });
    return d;
  }
  function newId(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  const findAch = (d, id) => d.achievements.find(a => a.id === id);
  const findCh  = (d, id) => d.challenges.find(c => c.id === id);
  const grantFor = (d, id) => d.grants.find(g => g.achId === id);
  const rightFor = (d, id) => d.rights.find(r => r.challengeId === id);

  function isValidGrant(g, today){ return !!g && (!g.expires || today <= g.expires); }
  function held(d, achId, today){ return isValidGrant(grantFor(d, achId), today); }
  function inPeriod(p, today){ return !p || ((!p.from || today >= p.from) && (!p.to || today <= p.to)); }
  function missing(d, requires, today){ return (requires || []).filter(id => !held(d, id, today)); }

  // 実績の状態:got(手に入れた) / open(今目指せる) / locked(鍵がかかっている)
  function achStatus(d, a, today){
    const g = grantFor(d, a.id);
    if(g){
      const valid = isValidGrant(g, today);
      const left = g.expires ? diffDays(today, g.expires) : null;
      return { state: 'got', grant: g, expired: !valid, near: valid && left !== null && left <= NEAR_DAYS, left, missing: [] };
    }
    const miss = missing(d, a.requires, today);
    const ok = miss.length === 0 && inPeriod(a.period, today);
    return { state: ok ? 'open' : 'locked', missing: miss, outOfPeriod: !inPeriod(a.period, today) };
  }

  // 挑戦権の状態
  function challengeStatus(d, c, today){
    const r = rightFor(d, c.id);
    if(r){
      const usedUp = r.left !== null && r.left <= 0;
      const expired = !!r.expires && today > r.expires;
      const last = r.log.length ? r.log[r.log.length - 1].day : null;
      const nextDay = (last && c.cooldownDays) ? addDays(last, c.cooldownDays) : null;
      return { state: 'got', right: r, usedUp, expired, nextDay, waiting: !!nextDay && today < nextDay, missing: [] };
    }
    const miss = missing(d, c.requires, today);
    return { state: (miss.length === 0 && inPeriod(c.period, today)) ? 'open' : 'locked', missing: miss };
  }

  function canApply(d, achId, today){
    const a = findAch(d, achId);
    if(!a) return { ok: false, reason: 'その実績はありません' };
    if(d.reviews.some(r => r.kind === 'apply' && r.target === achId && r.status === 'pending'))
      return { ok: false, reason: '審査を待っている申請があります' };
    const g = grantFor(d, achId);
    if(g){
      if(!a.renewDays) return { ok: false, reason: 'もう手に入れています' };
      return { ok: true, renewal: true };
    }
    if(!inPeriod(a.period, today)) return { ok: false, reason: '申請できる期間ではありません' };
    const miss = missing(d, a.requires, today);
    if(miss.length) return { ok: false, reason: '必要実績がそろっていません(' + miss.map(id => (findAch(d,id)||{}).name || id).join('、') + ')' };
    return { ok: true, renewal: false };
  }

  function submitApplication(d, { achId, evidence, today }){
    const c = canApply(d, achId, today);
    if(!c.ok) throw new Error(c.reason);
    if(!evidence || !evidence.trim()) throw new Error('証拠を書いてください');
    const r = { id: newId('r-'), day: today, kind: 'apply', target: achId, renewal: c.renewal, evidence: evidence.trim(), status: 'pending' };
    d.reviews.push(r);
    return r;
  }

  const posInt = v => { if(v === '' || v === null || v === undefined) return null; const n = Number(v); return Number.isFinite(n) && n >= 1 ? Math.floor(n) : NaN; };
  function cleanPeriod(p){ if(!p) return null; const from = p.from || null, to = p.to || null; return (from || to) ? { from, to } : null; }

  function cleanDef(type, raw){
    const def = {
      name: String(raw.name || '').trim(),
      fields: [...new Set(raw.fields || [])],
      condition: String(raw.condition || '').trim(),
      requires: [...new Set(raw.requires || [])],
      period: cleanPeriod(raw.period),
      art: raw.art || null,
    };
    if(type === 'achievement'){ def.renewDays = posInt(raw.renewDays); }
    else { def.uses = posInt(raw.uses); def.cooldownDays = posInt(raw.cooldownDays); def.validDays = posInt(raw.validDays); }
    return def;
  }

  function hasCycle(achs){
    const map = new Map(achs.map(a => [a.id, a.requires || []]));
    const seen = new Map(); // 1:たどっている 2:済み
    const visit = id => {
      if(seen.get(id) === 1) return true;
      if(seen.get(id) === 2) return false;
      seen.set(id, 1);
      for(const n of (map.get(id) || [])) if(visit(n)) return true;
      seen.set(id, 2); return false;
    };
    return [...map.keys()].some(visit);
  }

  function validateDef(d, type, def, id){
    const errs = [];
    if(!def.name) errs.push('名前がありません');
    if(!def.condition) errs.push('達成条件がありません');
    const list = type === 'achievement' ? d.achievements : d.challenges;
    if(list.some(x => x.name === def.name && x.id !== id)) errs.push('同じ名前のものがあります');
    def.requires.forEach(r => { if(!findAch(d, r)) errs.push('必要実績に、ない実績が入っています'); });
    if(type === 'challenge' && def.requires.length === 0) errs.push('挑戦権には必要実績が1つ以上いります');
    if(type === 'achievement' && id && def.requires.includes(id)) errs.push('自分自身を必要実績にはできません');
    if(type === 'achievement' && def.art && !d.arts.some(a => a.id === def.art)) errs.push('勲章が見つかりません');
    if(def.period && def.period.from && def.period.to && def.period.from > def.period.to) errs.push('期間の始まりが終わりより後です');
    ['renewDays','uses','cooldownDays','validDays'].forEach(k => { if(Number.isNaN(def[k])) errs.push('日数・回数は1以上の数で書いてください'); });
    if(type === 'achievement'){
      const after = d.achievements.filter(a => a.id !== id).concat([{ id: id || '__new', requires: def.requires }]);
      if(hasCycle(after)) errs.push('必要実績がぐるっと回ってつながっています');
    }
    return [...new Set(errs)];
  }

  function proposeRule(d, { op, type, id, def: raw, note, today }){
    const def = cleanDef(type, raw);
    let before = null;
    if(op === 'edit'){
      const cur = type === 'achievement' ? findAch(d, id) : findCh(d, id);
      if(!cur) throw new Error('直す対象が見つかりません');
      before = clone(cur);
    }
    const errs = validateDef(d, type, def, op === 'edit' ? id : null);
    if(errs.length) throw new Error(errs.join('/'));
    const r = { id: newId('r-'), day: today, kind: 'rule', target: op === 'edit' ? id : null,
      content: { op, type, id: op === 'edit' ? id : null, def, before }, note: String(note || '').trim(), status: 'pending' };
    d.reviews.push(r);
    return r;
  }

  // 条件がそろった挑戦権を渡す(一度得たものは取り上げない)
  function checkRights(d, today){
    const got = [];
    d.challenges.forEach(c => {
      if(rightFor(d, c.id)) return;
      if(!inPeriod(c.period, today)) return;
      if(!c.requires.length || missing(d, c.requires, today).length) return;
      const r = { challengeId: c.id, day: today, left: c.uses ?? null, expires: c.validDays ? addDays(today, c.validDays) : null, log: [] };
      d.rights.push(r); got.push(c.id);
    });
    return got;
  }

  function decide(d, reviewId, { approve, reason, today }){
    const r = d.reviews.find(x => x.id === reviewId);
    if(!r) throw new Error('その審査は見つかりません');
    if(r.status !== 'pending') throw new Error('この審査はもう決まっています');
    if(!reason || !reason.trim()) throw new Error('理由を書いてください');
    const out = { granted: null, newRights: [], ruleId: null };
    if(approve){
      if(r.kind === 'apply'){
        const a = findAch(d, r.target);
        if(!a) throw new Error('申請された実績が、もうありません');
        const g = grantFor(d, a.id);
        const expires = a.renewDays ? addDays(today, a.renewDays) : null;
        if(g){
          if(!r.renewal || !a.renewDays) throw new Error('もう手に入れています');
          g.renewals.push({ day: today, reviewId: r.id, evidence: r.evidence });
          g.expires = expires;
        } else {
          const miss = missing(d, a.requires, today);
          if(miss.length) throw new Error('必要実績がそろっていないので認められません');
          d.grants.push({ achId: a.id, day: today, evidence: r.evidence, reviewId: r.id, expires, renewals: [] });
        }
        out.granted = { achId: a.id, renewal: !!g };
      } else {
        const c = r.content;
        const errs = validateDef(d, c.type, c.def, c.op === 'edit' ? c.id : null);
        if(errs.length) throw new Error('今のルールでは認められません:' + errs.join('/'));
        const list = c.type === 'achievement' ? d.achievements : d.challenges;
        let id = c.id, before = null;
        if(c.op === 'add'){
          id = newId(c.type === 'achievement' ? 'a-' : 'c-');
          list.push(Object.assign({ id }, clone(c.def)));
        } else {
          const cur = list.find(x => x.id === id);
          if(!cur) throw new Error('直す対象が、もうありません');
          before = clone(cur);
          Object.assign(cur, clone(c.def), { id });
        }
        d.rules.push({ day: today, reviewId: r.id, op: c.op, type: c.type, id, before, after: clone(list.find(x => x.id === id)) });
        out.ruleId = id;
      }
      out.newRights = checkRights(d, today);
    }
    r.status = approve ? 'approved' : 'returned';
    r.reason = reason.trim();
    r.decidedDay = today;
    return out;
  }

  return { VERSION_DATA: 1, NEAR_DAYS, newId, taskDay, addDays, diffDays, emptyData, normalize, clone,
    findAch, findCh, grantFor, rightFor, held, inPeriod, missing, achStatus, challengeStatus,
    canApply, submitApplication, cleanDef, validateDef, hasCycle, proposeRule, checkRights, decide };
})();

const A = (() => {
  const METALS = { gold: ['#f4dc8f','#c9a24a','#7f601d'], silver: ['#f4f6f9','#b8bec9','#6f7682'], bronze: ['#efbb91','#b0703f','#683f1f'] };
  const METAL_NAMES = { gold: '金', silver: '銀', bronze: '銅' };
  const PALETTE = ['#7d1f2c','#5c1520','#2b4a86','#2f6b47','#1f2433','#ffffff','#5e2a7e','#c2552d'];
  const SHAPE_NAMES = { circle: '円', ellipse: '楕円', rect: '四角', poly: '多角形', star: '星', line: '線', path: '曲線' };
  const KINDS = ['形','紋','飾り'];
  let seq = 0;
  const f2 = n => +(+n).toFixed(2);

  function hexToHsl(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if(!m) return [40, 50, 50];
    const n = parseInt(m[1], 16), r = (n >> 16 & 255)/255, g = (n >> 8 & 255)/255, b = (n & 255)/255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2; let hh = 0, s = 0;
    if(mx !== mn){ const dd = mx-mn; s = l > .5 ? dd/(2-mx-mn) : dd/(mx+mn);
      hh = mx === r ? (g-b)/dd + (g < b ? 6 : 0) : mx === g ? (b-r)/dd + 2 : (r-g)/dd + 4; hh *= 60; }
    return [hh, s*100, l*100];
  }
  // 地金の色1・2・3(明るい・ふつう・暗い)
  function metal(m){
    if(METALS[m]) return METALS[m];
    if(/^#[0-9a-f]{6}$/i.test(m || '')){ const [hh, s, l] = hexToHsl(m);
      return [`hsl(${f2(hh)} ${f2(s)}% ${f2(Math.min(92, l+28))}%)`, m, `hsl(${f2(hh)} ${f2(s)}% ${f2(Math.max(10, l-30))}%)`]; }
    return METALS.gold;
  }
  function col(v, pal){ if(!v || v === 'none') return 'none'; if(v === 'm1') return pal[0]; if(v === 'm2') return pal[1]; if(v === 'm3') return pal[2]; return v; }

  function pathD(pts, closed, smooth){
    if(!pts || pts.length < 2) return 'M0 0';
    if(!smooth) return 'M' + pts.map(p => f2(p[0]) + ' ' + f2(p[1])).join('L') + (closed ? 'Z' : '');
    const n = pts.length, P = i => closed ? pts[(i % n + n) % n] : pts[Math.max(0, Math.min(n-1, i))];
    let d = `M${f2(pts[0][0])} ${f2(pts[0][1])}`;
    for(let i = 0; i < (closed ? n : n-1); i++){
      const p0 = P(i-1), p1 = P(i), p2 = P(i+1), p3 = P(i+2);
      d += `C${f2(p1[0]+(p2[0]-p0[0])/6)} ${f2(p1[1]+(p2[1]-p0[1])/6)} ${f2(p2[0]-(p3[0]-p1[0])/6)} ${f2(p2[1]-(p3[1]-p1[1])/6)} ${f2(p2[0])} ${f2(p2[1])}`;
    }
    return d + (closed ? 'Z' : '');
  }
  function ring(n, r, r2){
    const pts = [], k = r2 ? 2*n : n;
    for(let i = 0; i < k; i++){ const a = -Math.PI/2 + i*2*Math.PI/k, rr = (r2 && i % 2) ? r2 : r; pts.push(f2(rr*Math.cos(a)) + ',' + f2(rr*Math.sin(a))); }
    return pts.join(' ');

  function geom(s){
    switch(s.t){
      case 'circle': return `<circle r="${f2(s.r)}"`;
      case 'ellipse': return `<ellipse rx="${f2(s.rx)}" ry="${f2(s.ry)}"`;
      case 'rect': return `<rect x="${f2(-s.w/2)}" y="${f2(-s.h/2)}" width="${f2(s.w)}" height="${f2(s.h)}" rx="${f2(s.rx || 0)}"`;
      case 'poly': return `<polygon points="${ring(Math.max(3, s.n|0), s.r)}"`;
      case 'star': return `<polygon points="${ring(Math.max(3, s.n|0), s.r, s.r2)}"`;
      case 'line': return `<path d="${pathD(s.pts, false, s.smooth)}"`;
      case 'path': return `<path d="${pathD(s.pts, s.closed !== false, s.smooth)}"`;
    }
    return '<g';
  }
  // mode: undefined=ふつう / 'mask'=くり抜き用に黒 / 'hit'=つまむための見えない形
  function shapeSvg(s, pal, mode){
    let fill = s.t === 'line' ? 'none' : col(s.fill, pal), stroke = (s.sw > 0) ? col(s.stroke, pal) : 'none';
    if(mode === 'mask'){ fill = fill === 'none' ? 'none' : '#000'; stroke = stroke === 'none' ? 'none' : '#000'; }
    if(mode === 'hit'){ fill = 'none'; stroke = 'none'; }
    const sw = mode === 'hit' ? Math.max(4, s.sw || 0) : (s.sw || 0);
    const a = ` fill="${fill}" stroke="${stroke}" stroke-width="${f2(sw)}" stroke-linejoin="round" stroke-linecap="round"` +
      (s.dash && !mode ? ` stroke-dasharray="${s.dash}"` : '') + (!mode && s.alpha != null && s.alpha < 1 ? ` opacity="${s.alpha}"` : '');
    return `<g transform="translate(${f2(s.x || 0)} ${f2(s.y || 0)}) rotate(${f2(s.rot || 0)}) scale(${f2(s.s ?? 1)})">${geom(s)}${a}/></g>`;
  }
  function partInner(part, pal, opts){
    opts = opts || {};

    const adds = shapes.filter(s => !s.cut).map(s => shapeSvg(s, pal)).join('');

/* ===================== GitHub との読み書き ===================== */
const CFG_KEY = 'eiten.cfg';
function loadCfg(){ try{ return Object.assign({ owner:'nisenonamae', repo:'notion-daily', branch:'main', token:'' }, JSON.parse(localStorage.getItem(CFG_KEY) || '{}')); }catch(e){ return { owner:'nisenonamae', repo:'notion-daily', branch:'main', token:'' }; } }
function saveCfg(c){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(c)); }catch(e){} }

const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g, ''))));

async function gh(method, path, body){
  const c = S.cfg;
  let url = `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`;
  if(method === 'GET') url += `?ref=${encodeURIComponent(c.branch)}&t=${Date.now()}`;
  const headers = { Accept: 'application/vnd.github+json' };
  if(c.token) headers.Authorization = 'Bearer ' + c.token;
  if(body) headers['Content-Type'] = 'application/json';
  return fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
}
async function readJson(path){
  const r = await gh('GET', path);
  if(r.status === 404) return { json: null, sha: null };
  if(!r.ok) throw new Error(`読み込めませんでした(${path}:${r.status})`);
  const j = await r.json();
  return { json: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function reloadData(){
  const { json, sha } = await readJson(PATHS.data);
  S.data = E.normalize(json); S.sha = sha;
}
// 書き込み:sha を付けて出し、ぶつかったら読み直して最大3回やり直す
async function save(mutator, message){
  for(let attempt = 0; attempt <= 3; attempt++){
    const draft = E.clone(S.data);
    const result = mutator(draft);
    const body = { message: '栄典: ' + message, content: b64enc(JSON.stringify(draft, null, 1) + '\n'), branch: S.cfg.branch };
    if(S.sha) body.sha = S.sha;
    const r = await gh('PUT', PATHS.data, body);
    if(r.ok){ const j = await r.json(); S.sha = j.content.sha; S.data = draft; return result; }
    if(r.status === 409 || r.status === 422){ await reloadData(); continue; }
    throw new Error(`書き込めませんでした(${r.status})`);
  }
  throw new Error('ほかの書き込みとぶつかり続けたので、書き込みをやめました。読み込み直してから、もう一度やってください');
}
async function loadAll(){
  setStatus('読み込み中…');
  await reloadData();
  try{
    const m = await readJson(PATHS.ministries);
    S.ministries = parseMinistries(m.json);
  }catch(e){ S.ministries = []; }
  S.loaded = true;
  setStatus('読み込みました(' + E.taskDay() + ')');
}
function parseMinistries(j){
  if(!j) return [];
  const arr = Array.isArray(j) ? j : (j.ministries || j.list || Object.values(j));
  return (Array.isArray(arr) ? arr : []).filter(m => m && typeof m === 'object')
    .map((m, i) => ({ tag: m.tag || m.id, name: m.name || m.label || m.tag || m.id, order: m.order ?? m['順番'] ?? i }))
    .filter(m => m.tag).sort((a, b) => a.order - b.order);
}

let toastTimer;
function toast(msg, err){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', err ? 6000 : 3500);
}

function hueOf(tag){ let x = 0; for(const c of String(tag || '')) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
// 工房ができるまでの仮の勲章(分野の色の綬と、頭文字の円章)
function medalSvg(a, mode, size){
  size = size || 84;
  const hue = hueOf((a.fields || [])[0]);
  const ch = h((a.name || '?').trim().charAt(0));
  return `<svg class="medal m-${mode}" viewBox="0 0 100 120" width="${size}" height="${Math.round(size*1.2)}" aria-hidden="true">
<path d="M26 0h20l12 44H38z" fill="hsl(${hue} 42% 36%)"/><path d="M54 0h20L62 44H42z" fill="hsl(${hue} 42% 28%)"/>
<circle cx="50" cy="78" r="34" fill="#b08a3e"/><circle cx="50" cy="78" r="27" fill="#c9a55a" stroke="#f3e6c4" stroke-width="1.5"/>
<text x="50" y="89" text-anchor="middle" font-size="30" font-family="Shippori Mincho,serif" font-weight="700" fill="#3a2a0c">${ch}</text></svg>`;
}

function renderTabs(){
  $('#tabs .in').innerHTML = TABS.map(([k, n]) =>
    `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${n}</button>`).join('');
}
function render(){
  renderTabs();
  const m = $('#main');
  if(!S.loaded && !S.cfg.token){
    m.innerHTML = `<div class="empty">右上の「接続」から、リポジトリとトークンを入れてください。データは <b>${h(PATHS.data)}</b> に置きます。</div>`;
    return;
  }
  m.innerHTML = ({ tree: renderTree, list: renderList, review: renderReview, settings: renderSettings, studio: renderStudio }[S.tab])();
  if(S.tab === 'studio') drawCanvas();
}

function fieldChips(allLabel){
  const tags = [...new Set([...S.ministries.map(m => m.tag), ...S.data.achievements.flatMap(a => a.fields), ...S.data.challenges.flatMap(c => c.fields)])];
  return `<div class="chips"><button class="chip" data-act="field" data-v="all" aria-pressed="${S.field === 'all'}">${allLabel || 'すべて'}</button>` +
    tags.map(t => `<button class="chip" data-act="field" data-v="${h(t)}" aria-pressed="${S.field === t}">${h(fieldName(t))}</button>`).join('') + '</div>';
}
const inField = x => S.field === 'all' || (x.fields || []).includes(S.field);
const tags = fs => (fs || []).map(t => `<span class="tag">${h(fieldName(t))}</span>`).join('') || '<span class="note">分野なし</span>';
const reqList = (rs, t) => (rs || []).length ? rs.map(id => `${h(achName(id))}${E.held(S.data, id, t) ? '(持っている)' : '(まだ)'}`).join('、') : 'なし';

/* ---- 一覧 ---- */
function renderList(){
  const t = today(), d = S.data;
  const achs = d.achievements.filter(inField);
  const shelf = achs.length ? achs.map(a => {
    const st = E.achStatus(d, a, t);
    if(st.state !== 'got') return `<div class="slot off">${achMedal(a, 'shadow')}<div class="nm">${h(a.name)}</div><div class="sm">${st.state === 'open' ? '今目指せる' : '鍵がかかっている'}</div></div>`;
    const mode = st.expired ? 'expired' : st.near ? 'near' : 'got';
    const g = st.grant;
    const sub = [`${fmtDay(g.day)}認定`];
    if(g.expires) sub.push(st.expired ? '期限切れ・更新の申請を' : `更新期限 ${fmtDay(g.expires)}`);
    return `<div class="slot">${achMedal(a, mode)}<div class="nm">${h(a.name)}</div><div class="sm">${sub.map(h).join('<br>')}</div></div>`;
  }).join('') : '';
  const rights = d.rights.filter(r => { const c = E.findCh(d, r.challengeId); return c && inField(c); });
  const rightsHtml = rights.length ? rights.map(r => {
    const c = E.findCh(d, r.challengeId), st = E.challengeStatus(d, c, t);
    const bits = [`${fmtDay(r.day)}に得た`, r.left === null ? '回数は無制限' : `残り${r.left}回`];
    bits.push(r.expires ? (st.expired ? '有効期限が切れています' : `有効期限 ${fmtDay(r.expires)}`) : '有効期限なし');
    if(st.nextDay) bits.push(st.waiting ? `${fmtDay(st.nextDay)}から再挑戦できる` : '再挑戦できる');
    const off = st.usedUp || st.expired;
    return `<div class="card"><div class="door${off ? ' off' : ''}" aria-hidden="true"></div><div><h3>${h(c.name)}</h3><div class="note" style="margin:0">${bits.map(h).join('/')}</div></div></div>`;
  }).join('') : '<div class="empty">まだ挑戦権はありません。必要実績をそろえると、ここに並びます。</div>';
  return `<h2>手に入れた実績</h2>${fieldChips()}` +
    (shelf ? `<div class="shelf">${shelf}</div>` : '<div class="empty">まだ実績が決まっていません。審査会議で実績を足すと、ここに影が並びます。</div>') +
    `<h2>持っている挑戦権</h2><div class="rights">${rightsHtml}</div>`;
}

/* ---- 審査会議 ---- */
const DEF_ROWS = {
  achievement: [['name','名前'],['fields','分野'],['condition','達成条件'],['requires','必要実績'],['renewDays','更新制'],['period','申請できる期間'],['art','勲章']],
  challenge: [['name','名前'],['fields','分野'],['condition','達成条件'],['requires','必要実績'],['uses','回数'],['cooldownDays','再挑戦までの間'],['validDays','有効期限'],['period','得られる期間']],
};
function fmtVal(k, v){
  if(k === 'fields') return (v || []).map(fieldName).join('、') || 'なし';
  if(k === 'requires') return (v || []).map(achName).join('、') || 'なし';
  if(k === 'period') return fmtPeriod(v);
  if(k === 'art'){ const a = findArt(v); return v ? (a ? a.name : '(なくなった勲章)') : '仮の勲章'; }
  if(k === 'renewDays') return v ? `${v}日ごとに再審査` : 'なし';
  if(k === 'uses') return v ? `${v}回まで` : '無制限';
  if(k === 'cooldownDays') return v ? `${v}日` : 'なし';
  if(k === 'validDays') return v ? `得てから${v}日` : 'なし';
  return v ?? '';
}
function diffTable(c){
  return `<table class="diff"><tr><th></th>${c.before ? '<th>今</th>' : ''}<th>${c.before ? '変えたあと' : '中身'}</th></tr>` +
    DEF_ROWS[c.type].map(([k, n]) => {
      const a = c.before ? fmtVal(k, c.before[k]) : null, b = fmtVal(k, c.def[k]);
      return `<tr class="${c.before && a !== b ? 'chg' : ''}"><th>${n}</th>${c.before ? `<td>${h(a)}</td>` : ''}<td>${h(b)}</td></tr>`;
    }).join('') + '</table>';
}
const ruleTitle = c => `${c.type === 'achievement' ? '実績' : '挑戦権'}を${c.op === 'add' ? '足す' : '直す'}:${c.def.name}`;

             <div class="two">${num('rf-valid', '有効期限(得てから何日)', d.validDays, '空ならなし')}<span></span></div>`}
    <div class="two"><label class="f">${isA ? '申請できる' : '得られる'}期間の始まり<input type="date" id="rf-from" value="${h(p.from || '')}"></label>

function readRuleForm(){
  const v = id => ($('#' + id) || {}).value || '';
  const checked = n => [...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x => x.value);
  const raw = { name: v('rf-name'), fields: checked('rf-field'), condition: v('rf-cond'), requires: checked('rf-req'),
    period: { from: v('rf-from'), to: v('rf-to') }, art: S.ruleDraft.type === 'achievement' ? (v('rf-art') || null) : null };
  if(S.ruleDraft.type === 'achievement') raw.renewDays = v('rf-renew');
  else { raw.uses = v('rf-uses'); raw.cooldownDays = v('rf-cool'); raw.validDays = v('rf-valid'); }
  return { raw, note: v('rf-note') };
}

/* ===================== 勲章の表示 ===================== */
const getPart = id => A.builtin(id) || S.data.parts.find(p => p.id === id);
const findArt = id => id ? S.data.arts.find(a => a.id === id) : null;
function achMedal(a, mode, size){
  const art = findArt(a.art);
  return art ? A.artSvg(art, getPart, { mode, size }) : medalSvg(a, mode, size);
}
const medalRatio = a => findArt(a.art) ? 1 : 1.2;

/* ===================== 樹形図 ===================== */
const TREE = { COL: 104, ROW: 124, PAD: 44 };
function treeLayout(d, field, t){
  const inF = x => field === 'all' || (x.fields || []).includes(field);
  const achs = new Map(d.achievements.map(a => [a.id, a]));
  const set = new Set(), outside = new Set();
  d.achievements.filter(inF).forEach(a => set.add(a.id));
  const chs = d.challenges.filter(inF);
  const pullIn = id => { const a = achs.get(id); if(!a) return; (a.requires || []).forEach(r => { if(achs.has(r) && !set.has(r)){ set.add(r); outside.add(r); pullIn(r); } }); };
  [...set].forEach(pullIn);
  chs.forEach(c => c.requires.forEach(r => { if(achs.has(r) && !set.has(r)){ set.add(r); outside.add(r); pullIn(r); } }));
  const memo = new Map();
  const depth = (id, seen = new Set()) => {
    if(memo.has(id)) return memo.get(id);
    if(seen.has(id)) return 0; seen.add(id);
    const reqs = (achs.get(id).requires || []).filter(r => set.has(r));
    const v = reqs.length ? 1 + Math.max(...reqs.map(r => depth(r, seen))) : 0;
    memo.set(id, v); return v;
  };
  const nodes = [...set].map(id => ({ key: 'a:' + id, type: 'a', id, obj: achs.get(id), depth: depth(id), outside: outside.has(id) }));
  chs.forEach(c => { const reqs = c.requires.filter(r => set.has(r)); nodes.push({ key: 'c:' + c.id, type: 'c', id: c.id, obj: c, depth: reqs.length ? 1 + Math.max(...reqs.map(r => depth(r))) : 0, outside: false }); });
  const edges = [];
  nodes.forEach(n => (n.obj.requires || []).forEach(r => { if(set.has(r)) edges.push({ from: 'a:' + r, to: n.key, on: E.held(d, r, t) }); }));
  // 段ごとに並べ、親の位置の平均で順番を決める
  const maxD = nodes.reduce((m, n) => Math.max(m, n.depth), 0);
  const rows = Array.from({ length: maxD + 1 }, (_, i) => nodes.filter(n => n.depth === i));
  const pos = new Map();
  rows.forEach((row, i) => {
    if(i === 0) row.sort((a, b) => (a.obj.fields[0] || '').localeCompare(b.obj.fields[0] || '') || a.obj.name.localeCompare(b.obj.name));
    else row.forEach(n => { const ps = (n.obj.requires || []).map(r => pos.get('a:' + r)).filter(v => v !== undefined); n.bary = ps.length ? ps.reduce((s, v) => s + v, 0)/ps.length : 0; }), row.sort((a, b) => a.bary - b.bary || (a.type < b.type ? -1 : 1));
    row.forEach((n, j) => pos.set(n.key, j - (row.length - 1)/2));
  });
  const widest = Math.max(1, ...rows.map(r => r.length));
  const W = Math.max(320, widest*TREE.COL + TREE.PAD*2), H = TREE.PAD + maxD*TREE.ROW + 74;
  nodes.forEach(n => { n.x = W/2 + pos.get(n.key)*TREE.COL; n.y = TREE.PAD + n.depth*TREE.ROW; });
  return { nodes, edges, W, H };
}
function nodeState(n, t){
  return n.type === 'a' ? E.achStatus(S.data, n.obj, t) : E.challengeStatus(S.data, n.obj, t);
}
function treeSvg(L, t){
  const at = new Map(L.nodes.map(n => [n.key, n]));
  const edges = L.edges.map(e => { const a = at.get(e.from), b = at.get(e.to); const y1 = a.y + 32, y2 = b.y - 34;
    return `<path class="edge${e.on ? ' on' : ''}" d="M${a.x} ${y1}C${a.x} ${y1 + 40} ${b.x} ${y2 - 40} ${b.x} ${y2}"/>`; }).join('');
  const nodes = L.nodes.map(n => {
    const st = nodeState(n, t), name = n.obj.name;
    const label = h(name.length > 8 ? name.slice(0, 8) + '…' : name);
    const cls = `tn tn-${st.state}${n.outside ? ' tn-out' : ''}${S.treeSel === n.key ? ' tn-sel' : ''}`;
    let body;
    if(n.type === 'a'){
      const mode = st.state !== 'got' ? 'shadow' : st.expired ? 'expired' : st.near ? 'near' : 'got';
      const size = 40, hh = size*medalRatio(n.obj);

  if(svg.setPointerCapture) try{ svg.setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault(); drawCanvas();
}
function onPointerMove(e){
  if(!drag) return;
  const svg = $('#st-canvas'); if(!svg) return; const pt = svgPt(svg, e); if(!pt) return;
  const obj = ST.mode === 'part' ? curShape() : curLayer(); if(!obj) return;
  if(drag.kind === 'move'){ obj.x = +clamp(drag.ox + pt[0] - drag.start[0], -20, 120).toFixed(1); obj.y = +clamp(drag.oy + pt[1] - drag.start[1], -20, 120).toFixed(1); }
  else obj.pts[drag.h] = toLocal(obj, pt);
  ST.dirty = true; drawCanvas(); syncSliders();
}
function onPointerUp(){ if(drag){ drag = null; renderPanel(); } }

const Studio = {
  mode(v){ if(v === ST.mode) return; ST.mode = v; render(); },
  newPart(){ if(!okToLeave()) return; ST.part = blankPart(); ST.sel = -1; render(); },
  pickPart(id){
    if(!okToLeave()) return;
    const src = getPart(id); if(!src) return;
    ST.part = E.clone(src);
    if(src.builtin){ delete ST.part.builtin; ST.part.id = null; ST.part.name = src.name + '(直し)'; }
    ST.sel = ST.part.shapes.length ? ST.part.shapes.length - 1 : -1; render();
  },
  addShape(t){ const s = Object.assign({ x: 50, y: 50, s: 1, rot: 0, fill: 'm2', stroke: 'm3', sw: 0 }, NEW_SHAPE[t]()); ST.part.shapes.push(s); ST.sel = ST.part.shapes.length - 1; ST.dirty = true; render(); },
  sel(i){ ST.sel = i; renderPanel(); drawCanvas(); },
  move(list, i, dir, selKey){ const j = i + dir; if(j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; ST[selKey] = j; ST.dirty = true; render(); },
  dup(list, i, selKey){ list.splice(i + 1, 0, E.clone(list[i])); ST[selKey] = i + 1; ST.dirty = true; render(); },
  del(list, i, selKey){ list.splice(i, 1); ST[selKey] = Math.min(ST[selKey], list.length - 1); ST.dirty = true; render(); },
  color(target, v){
    const s = curShape(); if(!s) return;
    if(target === 'fill') s.fill = v; else { s.stroke = v; if(!(s.sw > 0)) s.sw = 2; }
    ST.dirty = true; renderPanel(); drawCanvas();
  },
  ptAdd(){ const s = curShape(); if(!s || !s.pts) return; const a = s.pts[s.pts.length - 1], b = s.pts[s.pts.length - 2] || [0,0]; s.pts.push([+(a[0] + (a[0]-b[0])*.5 + 4).toFixed(1), +(a[1] + (a[1]-b[1])*.5).toFixed(1)]); ST.dirty = true; renderPanel(); drawCanvas(); },
  ptDel(){ const s = curShape(); if(!s || !s.pts || s.pts.length <= 2) return; s.pts.pop(); ST.dirty = true; renderPanel(); drawCanvas(); },
  async savePart(){
    const p = E.clone(ST.part); p.name = (p.name || '').trim();
    if(!p.name){ toast('部品に名前を付けてください', true); return null; }
    if(!p.shapes.length){ toast('図形が1つもありません', true); return null; }
    const id = await commit(d => {
      if(p.id){ const cur = d.parts.find(x => x.id === p.id); if(cur){ Object.assign(cur, E.clone(p)); return p.id; } }
      const np = Object.assign(E.clone(p), { id: E.newId('p-') }); d.parts.push(np); return np.id;
    }, `部品 ${p.name}`, () => '部品の棚にしまいました');
    if(id){ ST.part.id = id; ST.part.name = p.name; ST.dirty = false; render(); }
    return id;
  },
  async delPart(){
    const p = ST.part; if(!p.id) return;
    if(S.data.arts.some(a => a.layers.some(L => L.part === p.id))){ toast('この部品を使っている勲章があるので消せません', true); return; }
    const ok = await commit(d => { d.parts = d.parts.filter(x => x.id !== p.id); return true; }, `部品を消す ${p.name}`, () => '部品を消しました');
    if(ok){ ST.part = blankPart(); ST.sel = -1; ST.dirty = false; render(); }
  },
  newArt(){ if(!okToLeave()) return; ST.art = blankArt(); ST.lsel = -1; render(); },
  pickArt(id){ if(!okToLeave()) return; const a = findArt(id); if(!a) return; ST.art = E.clone(a); ST.art.text = ST.art.text || { str: '', y: 58, size: 14, fill: '#3a2a0c' }; ST.lsel = -1; render(); },
  addLayer(id){ const p = getPart(id); if(!p) return; const L = { part: id, x: 50, y: 50, s: p.kind === '紋' ? .55 : 1, rot: 0, metal: 'gold' }; ST.art.layers.push(L); ST.lsel = ST.art.layers.length - 1; ST.dirty = true; render(); },
  lsel(i){ ST.lsel = i; renderPanel(); drawCanvas(); },
  metal(v){ const L = curLayer(); if(!L) return; L.metal = v; ST.dirty = true; renderPanel(); drawCanvas(); },
  async saveArt(){
    const a = E.clone(ST.art); a.name = (a.name || '').trim();
    if(!a.name){ toast('勲章に名前を付けてください', true); return null; }
    if(!a.layers.length){ toast('部品が1つもありません', true); return null; }
    const id = await commit(d => {
      if(a.id){ const cur = d.arts.find(x => x.id === a.id); if(cur){ Object.assign(cur, E.clone(a)); return a.id; } }
      const na = Object.assign(E.clone(a), { id: E.newId('art-') }); d.arts.push(na); return na.id;
    }, `勲章 ${a.name}`, () => '勲章をしまいました');
    if(id){ ST.art.id = id; ST.art.name = a.name; ST.dirty = false; render(); }
    return id;
  },
  async delArt(){
    const a = ST.art; if(!a.id) return;
    if(S.data.achievements.some(x => x.art === a.id)){ toast('この勲章が結びついた実績があるので消せません', true); return; }
    const ok = await commit(d => { d.arts = d.arts.filter(x => x.id !== a.id); return true; }, `勲章を消す ${a.name}`, () => '勲章を消しました');
    if(ok){ ST.art = blankArt(); ST.lsel = -1; ST.dirty = false; render(); }
  },
};
function studioClick(act, b){
  const i = +b.dataset.i;
  switch(act){
    case 'st-mode': return Studio.mode(b.dataset.v);
    case 'st-new-part': return Studio.newPart();
    case 'st-pick-part': return Studio.pickPart(b.dataset.id);
    case 'st-add-shape': return Studio.addShape(b.dataset.v);
    case 'st-sel': return Studio.sel(i);
    case 'st-up': return Studio.move(ST.part.shapes, i, 1, 'sel');
    case 'st-down': return Studio.move(ST.part.shapes, i, -1, 'sel');
    case 'st-dup': return Studio.dup(ST.part.shapes, i, 'sel');
    case 'st-del': return Studio.del(ST.part.shapes, i, 'sel');
    case 'st-color': return Studio.color(b.dataset.target, b.dataset.v);
    case 'st-pt-add': return Studio.ptAdd();
    case 'st-pt-del': return Studio.ptDel();
    case 'st-save-part': return Studio.savePart();
    case 'st-del-part': return Studio.delPart();
    case 'st-new-art': return Studio.newArt();
    case 'st-pick-art': return Studio.pickArt(b.dataset.id);
    case 'st-add-layer': return Studio.addLayer(b.dataset.id);
    case 'st-lsel': return Studio.lsel(i);
    case 'st-lup': return Studio.move(ST.art.layers, i, 1, 'lsel');
    case 'st-ldown': return Studio.move(ST.art.layers, i, -1, 'lsel');
    case 'st-ldup': return Studio.dup(ST.art.layers, i, 'lsel');
    case 'st-ldel': return Studio.del(ST.art.layers, i, 'lsel');
    case 'st-metal': return Studio.metal(b.dataset.v);
    case 'st-save-art': return Studio.saveArt();
    case 'st-del-art': return Studio.delArt();
  }
}

/* ===================== 認定の演出 ===================== */
function celebrate(achId, renewal){
  const a = E.findAch(S.data, achId); if(!a) return;
  const old = $('#fanfare'); if(old) old.remove();
  const el = document.createElement('div');
  el.id = 'fanfare'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', `${a.name}を${renewal ? '更新' : '認定'}`);
  const colors = ['#c9a24a','#f4dc8f','#7d1f2c','#2b4a86','#ffffff','#b8bec9'];
  let cf = '';
  for(let i = 0; i < 70; i++) cf += `<i class="cf" style="left:${(Math.random()*100).toFixed(1)}%;background:${colors[i % colors.length]};animation-duration:${(2.6 + Math.random()*2.6).toFixed(2)}s;animation-delay:${(Math.random()*.9).toFixed(2)}s;rotate:${Math.floor(Math.random()*360)}deg"></i>`;
  el.innerHTML = `<svg class="rays" viewBox="0 0 100 100" aria-hidden="true">${A.partInner(A.builtin('b-hikari'), A.metal('gold'))}</svg>${cf}
    <div class="big">${achMedal(a, 'got', 200)}</div><h2>${h(a.name)}</h2><p>${renewal ? '更新しました。勲章がまた輝きます' : '認定されました'}</p><p class="close">押すと閉じます</p>`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
}

/* ---- 操作 ---- */
async function commit(fn, message, okMsg){
  if(!S.cfg.token){ toast('先に接続してください', true); return null; }
  if(S.busy) return null;
  S.busy = true;
  let res = null;
  try{ res = await save(fn, message); if(okMsg) toast(okMsg(res)); }
  catch(err){ toast(err.message, true); }
  finally{ S.busy = false; }
  render();
  return res;
}

const Actions = {
  async apply(){
    const achId = $('#ap-ach').value, evidence = $('#ap-evi').value;
    if(!achId){ toast('実績を選んでください', true); return; }
    const t = today();
    return commit(d => E.submitApplication(d, { achId, evidence, today: t }), `申請 ${achName(achId)}`, () => '申請しました。審査を待っています');
  },
  async decide(id, ok){
    const reason = ($('#why-' + id) || {}).value || '';
    const t = today();
    return commit(d => E.decide(d, id, { approve: ok, reason, today: t }), ok ? '審査で認めた' : '審査で差し戻した', res => {
      if(!ok) return '差し戻しました';
      const parts = [];
      if(res.granted) parts.push(`「${achName(res.granted.achId)}」を${res.granted.renewal ? '更新' : '認定'}しました`);
      if(res.ruleId) parts.push('ルールの変更を反映しました');
      if(res.newRights.length) parts.push('挑戦権を得ました:' + res.newRights.map(chName).join('、'));
      return parts.join('。');
    }).then(res => { if(ok && res && res.granted) celebrate(res.granted.achId, res.granted.renewal); return res; });
  },
  async ruleSubmit(){
    const { raw, note } = readRuleForm();
    const r = S.ruleDraft, t = today();
    r.def = Object.assign({}, r.def, raw); r.note = note; // 失敗しても書いたものを残す
    const res = await commit(d => E.proposeRule(d, { op: r.op, type: r.type, id: r.id, def: raw, note, today: t }), 'ルールの変更を申し出た', () => '審査会議に出しました');
    if(res){ S.ruleDraft = null; render(); }
    return res;
  },
  startRule(op, type, id){
    const cur = id ? (type === 'achievement' ? E.findAch(S.data, id) : E.findCh(S.data, id)) : null;
    S.ruleDraft = { op, type, id: id || null, def: cur ? E.clone(cur) : { name: '', fields: S.field !== 'all' ? [S.field] : [], condition: '', requires: [], period: null }, note: '' };
    S.tab = 'review'; render();
    const f = $('#rule-form'); if(f && f.scrollIntoView) f.scrollIntoView({ block: 'start' });
  },
};

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-tab]');
  if(tb){ S.tab = tb.dataset.tab; render(); return; }
  const b = e.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act === 'field'){ S.field = b.dataset.v; render(); }
  else if(act === 'apply') Actions.apply();
  else if(act === 'decide') Actions.decide(b.dataset.id, b.dataset.ok === '1');
  else if(act === 'propose-add') Actions.startRule('add', b.dataset.type);
  else if(act === 'propose-edit') Actions.startRule('edit', b.dataset.type, b.dataset.id);
  else if(act === 'rule-cancel'){ S.ruleDraft = null; render(); }
  else if(act === 'rule-submit') Actions.ruleSubmit();
  else if(act === 'goto-def'){ S.tab = 'settings'; S.field = 'all'; render(); const el = document.getElementById('def-' + b.dataset.id); if(el && el.scrollIntoView) el.scrollIntoView({ block: 'center' }); }
  else if(act === 'goto-apply'){ S.tab = 'review'; S.applyPreset = b.dataset.id; render(); }
  else if(act.startsWith('st-')) studioClick(act, b);
});
document.addEventListener('click', e => {
  const n = e.target.closest && e.target.closest('[data-node]');
  if(!n) return;
  S.treeSel = S.treeSel === n.dataset.node ? null : n.dataset.node; render();
  const dt = $('#tree-detail'); if(dt && dt.scrollIntoView && window.innerWidth < 760) dt.scrollIntoView({ block: 'nearest' });
});
document.addEventListener('keydown', e => {
  const n = e.target.closest && e.target.closest('[data-node]');
  if(n && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); n.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
document.addEventListener('input', onStudioInput);
document.addEventListener('change', onStudioInput);
document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('pointermove', onPointerMove);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

function initConn(){
  $('#ver').textContent = VERSION;
  ['owner','repo','branch','token'].forEach(k => $('#c-' + k).value = S.cfg[k] || '');
  const panel = $('#conn'), btn = $('#connBtn');
  btn.addEventListener('click', () => { panel.hidden = !panel.hidden; btn.setAttribute('aria-expanded', String(!panel.hidden)); });
  $('#c-save').addEventListener('click', async () => {
    ['owner','repo','branch','token'].forEach(k => S.cfg[k] = $('#c-' + k).value.trim());
    saveCfg(S.cfg);
    try{ await loadAll(); toast('読み込みました'); }catch(err){ setStatus(''); toast(err.message, true); }
    render();
  });
  if(!S.cfg.token) panel.hidden = false;
}

const App = { S, E, A, Actions, Studio, treeLayout, celebrate, render, loadAll, save, VERSION };
window.App = App;
initConn();
render();
App.ready = (S.cfg.token ? loadAll().catch(err => toast(err.message, true)) : Promise.resolve()).then(render);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
